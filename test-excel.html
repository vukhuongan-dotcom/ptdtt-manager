<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Test Excel Export</title>
<style>
body{font-family:system-ui;padding:20px;max-width:600px;margin:0 auto}
button{display:block;width:100%;padding:15px;margin:10px 0;font-size:16px;cursor:pointer;border:2px solid #0891b2;background:#e0f7fa;border-radius:8px}
button:active{background:#b2ebf2}
.fix-btn{background:#dc2626;color:white;border-color:#991b1b;font-weight:bold;font-size:18px;padding:20px}
.fix-btn:active{background:#b91c1c}
#log{background:#f0f0f0;padding:15px;border-radius:8px;font-size:13px;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow:auto}
.status{font-size:18px;font-weight:bold;padding:10px;border-radius:8px;margin:10px 0}
.ok{background:#d4edda;color:#155724}
.err{background:#f8d7da;color:#721c24}
</style>
</head>
<body>
<h2>🧪 Test Excel Export</h2>
<div id="status" class="status">Đang tải SheetJS...</div>

<button class="fix-btn" onclick="fixApp()">🔧 SỬA LỖI APP CHÍNH — Bấm đây rồi reload app</button>
<p style="color:#dc2626;text-align:center;font-weight:bold">⬆️ Bấm nút đỏ trước, đợi 3 giây, rồi mở lại app chính</p>

<hr>
<button onclick="testBlob()">1️⃣ Blob + a.click()</button>
<button onclick="testWriteFile()">2️⃣ XLSX.writeFile()</button>
<button onclick="testBase64()">3️⃣ Base64 Data URI</button>

<h3>📋 Log:</h3>
<pre id="log"></pre>

<script>
var logEl = document.getElementById('log');
function log(msg) {
    var ts = new Date().toLocaleTimeString();
    logEl.textContent = '[' + ts + '] ' + msg + '\n' + logEl.textContent;
}

function fixApp() {
    log('🔧 Bắt đầu sửa lỗi...');
    var p1 = navigator.serviceWorker.getRegistrations().then(function(regs) {
        regs.forEach(function(r) { r.unregister(); log('✅ Unregistered SW: ' + r.scope); });
        if (regs.length === 0) log('⚠️ Không có SW nào để xóa');
    });
    var p2 = caches.keys().then(function(names) {
        return Promise.all(names.map(function(n) { return caches.delete(n).then(function() { log('✅ Xóa cache: ' + n); }); }));
    });
    Promise.all([p1, p2]).then(function() {
        log('🎉 HOÀN TẤT! Chuyển sang app chính sau 3 giây...');
        setTimeout(function() {
            window.location.href = 'https://khoaptdtt.info.vn/?cachebust=' + Date.now();
        }, 3000);
    });
}
</script>

<script src="js/xlsx.full.min.js" onerror="log('❌ SheetJS FAILED to load!')"></script>

<script>
window.onload = function() {
    var s = document.getElementById('status');
    if (typeof XLSX !== 'undefined') {
        s.className = 'status ok';
        s.textContent = '✅ SheetJS v' + XLSX.version + ' loaded OK';
        log('✅ XLSX loaded: v' + XLSX.version);
    } else {
        s.className = 'status err';
        s.textContent = '❌ SheetJS KHÔNG TẢI ĐƯỢC';
        log('❌ XLSX undefined');
    }
};

function makeWB() {
    var wb = XLSX.utils.book_new();
    var data = [['STT','Ten','So'],  [1,'Test A',10], [2,'Test B',20], ['','TONG',30]];
    var ws = XLSX.utils.aoa_to_sheet(data);
    XLSX.utils.book_append_sheet(wb, ws, 'Data');
    return wb;
}

function testBlob() {
    log('--- Method 1: Blob + a.click ---');
    try {
        var wb = makeWB();
        var wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
        log('XLSX.write OK, bytes: ' + wbout.byteLength);
        var blob = new Blob([wbout], {type:'application/octet-stream'});
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = 'test_blob.xlsx'; a.style.display = 'none';
        document.body.appendChild(a); a.click();
        log('✅ a.click() done — kiểm tra Downloads');
        setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
    } catch(e) { log('❌ Error: ' + e.message); }
}

function testWriteFile() {
    log('--- Method 2: XLSX.writeFile ---');
    try {
        var wb = makeWB();
        XLSX.writeFile(wb, 'test_writefile.xlsx');
        log('✅ writeFile done — kiểm tra Downloads');
    } catch(e) { log('❌ Error: ' + e.message); }
}

function testBase64() {
    log('--- Method 3: Base64 ---');
    try {
        var wb = makeWB();
        var b64 = XLSX.write(wb, {bookType:'xlsx', type:'base64'});
        var a = document.createElement('a');
        a.href = 'data:application/octet-stream;base64,' + b64;
        a.download = 'test_base64.xlsx';
        document.body.appendChild(a); a.click();
        log('✅ Base64 click done');
        setTimeout(function(){ document.body.removeChild(a); }, 500);
    } catch(e) { log('❌ Error: ' + e.message); }
}
</script>
</body>
</html>
