# Nginx config for PTDTT Manager
# Place at: /etc/nginx/sites-available/ptdtt (and /etc/nginx/sites-enabled/ptdtt)

server {
    server_name khoaptdtt.info.vn www.khoaptdtt.info.vn;

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/khoaptdtt.info.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khoaptdtt.info.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;
    server_tokens off;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Block direct access to sensitive backend/data/deploy files (Defense-in-Depth T01)
    location ~* ^/(data|logs|deploy|docs|PROJECT_CONTEXT|backups|\.git|\.claude|server_flask\.py|server\.py|VERSION\.md|AUDIT_REPORT\.md|build-css\.sh) {
        return 404;
    }

    # SSE real-time stream: disable proxy buffering
    location = /api/events {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # API: network only, no cache
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # sw.js: no cache (always fresh)
    location = /sw.js {
        root /var/www/ptdtt-manager;
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # index.html: no cache
    location = /index.html {
        root /var/www/ptdtt-manager;
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # manifest.json
    location = /manifest.json {
        root /var/www/ptdtt-manager;
        try_files $uri =404;
        expires 5m;
    }

    # Static assets (css, js, img, fonts including webp & woff2)
    location ~* ^/(css|js|img|fonts)/.*\.(css|js|png|jpg|jpeg|webp|svg|ico|woff|woff2|ttf)$ {
        root /var/www/ptdtt-manager;
        try_files $uri =404;
        expires 5m;
    }

    # SHCM downloads: via Flask (authenticated)
    location /shcm/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Root and everything else -> Flask (which enforces STATIC_FILES allowlist)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}

server {
    listen 80;
    server_name khoaptdtt.info.vn www.khoaptdtt.info.vn 180.93.138.83;
    if ($host = khoaptdtt.info.vn) {
        return 301 https://$host$request_uri;
    }
    return 404;
}
