    <!-- One-time cache migration — runs BEFORE any other script -->
    <script>
        (function () {
            var REQUIRED_VER = '2608041136';
            if (localStorage.getItem('ptdtt_cache_ver') === REQUIRED_VER) return;
            // Nuke all service workers and caches
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                    regs.forEach(function (r) { r.unregister(); });
                });
            }
            if ('caches' in window) {
                caches.keys().then(function (names) {
                    names.forEach(function (n) { caches.delete(n); });
                });
            }
            // Clear stale business data (session is preserved)
            localStorage.removeItem('ptdtt_manager');
            localStorage.removeItem('ptdtt_lastActivity');
            localStorage.setItem('ptdtt_cache_ver', REQUIRED_VER);
            // Force clean reload after cache purge
            setTimeout(function () { location.reload(); }, 200);
        })();
    </script>

    <!-- Offline Banner -->
    <div id="offline-banner"
        style="display:none;position:fixed;top:0;left:0;right:0;z-index:9998;background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;text-align:center;padding:8px 16px;font-size:0.82rem;font-weight:600;font-family:Inter,system-ui,sans-serif">
        ⚠️ Đang offline — Dữ liệu có thể chưa cập nhật. Kiểm tra kết nối mạng.
    </div>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            let swControllerRefreshing = false;

            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (swControllerRefreshing) return;
                swControllerRefreshing = true;
                window.location.reload();
            });

            window.addEventListener('load', async () => {
                try {
                    const reg = await navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' });
                    console.log('SW registered:', reg.scope);
                    if (reg.waiting) { reg.waiting.postMessage({ type: 'SKIP_WAITING' }); }
                    reg.update();
                } catch (e) { console.log('SW registration failed:', e); }
            });
        }
        // Offline/Online banner
        function updateOnlineStatus() {
            const banner = document.getElementById('offline-banner');
            if (banner) banner.style.display = navigator.onLine ? 'none' : 'block';
        }
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        window.addEventListener('load', updateOnlineStatus);
    </script>
