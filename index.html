    <!-- One-time cache migration — runs BEFORE any other script -->
    <script>
        (function () {
            var SCHEMA_MIGRATION_VER = '2609281105';
            var SW_BUILD_VER = '2611261009';
            window.SW_BUILD_VER = SW_BUILD_VER;
            var needMigration = localStorage.getItem('ptdtt_cache_ver') !== SCHEMA_MIGRATION_VER;
            var needSwUpdate = navigator.onLine !== false && localStorage.getItem('ptdtt_sw_build') !== SW_BUILD_VER;
            if (!needMigration && !needSwUpdate) return;
            localStorage.setItem('ptdtt_cache_ver', SCHEMA_MIGRATION_VER);
            localStorage.setItem('ptdtt_sw_build', SW_BUILD_VER);
            var hadController = Boolean(navigator.serviceWorker && navigator.serviceWorker.controller);
            // Nuke all service workers and caches
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                    regs.forEach(function (r) { r.unregister(); });
                });
            }
            if ('caches' in window) {
                caches.keys().then(function (names) {
                    names.forEach(function (n) { caches.delete(n); });
                });
            }
            if (needMigration || hadController) {
                localStorage.removeItem('ptdtt_lastActivity');
                setTimeout(function () { location.reload(); }, 150);
            }
        })();
    </script>

        ⚠️ Đang offline — Dữ liệu có thể chưa cập nhật. Kiểm tra kết nối mạng.
    </div>

    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            let swControllerRefreshing = false;

            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (swControllerRefreshing) return;
                swControllerRefreshing = true;
            });

            window.addEventListener('load', async () => {
                try {
                    const reg = await navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' });
                    if (reg.waiting) { reg.waiting.postMessage({ type: 'SKIP_WAITING' }); }
                    reg.update();
                } catch (e) { console.log('SW registration failed:', e); }
            });
        }
        // Offline/Online banner
        function updateOnlineStatus() {
            const banner = document.getElementById('offline-banner');
            if (banner) banner.style.display = navigator.onLine ? 'none' : 'block';
        }
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        window.addEventListener('load', updateOnlineStatus);
    </script>
</body>

</html>
